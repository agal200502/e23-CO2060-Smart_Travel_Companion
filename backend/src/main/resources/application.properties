# ===============================
# SERVER
# ===============================
server.port=${PORT:8080}
server.address=0.0.0.0
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ===============================
# DATABASE CONFIG
# ===============================
spring.datasource.url=jdbc:mysql://mysql-134a59fb-smart-travel-companion.a.aivencloud.com:25605/smart_travel_db?sslMode=REQUIRED
spring.datasource.usernaspring.datasource.password=${SPRING_DATASOURCE_PASSWORD}me=avnadmin
sspring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
spring.sql.init.platform=h2

# ===============================
# OPTIONAL
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET:local-development-secret-key-at-least-32-characters}
jwt.expiration=86400000

# ===============================
# ACTUATOR
# ===============================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true